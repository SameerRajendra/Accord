[project]
name = "accord"
version = "0.0.0"
description = "LLM-powered negotiation-intelligence API — measured, retrieval-augmented, containerized."
readme = "README.md"
# 3.9+ so it runs on the GPU-cluster venv (python3.9). Code avoids PEP 604
# (`X | None`) runtime unions because pydantic evaluates model annotations.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sameer Rajendra" }]
# Runtime deps are pinned in requirements.txt and grow per build phase.
# Phase 0 needs only pydantic; it is duplicated here so `pip install -e .` works.
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data", "analysis", "rag", "agent", "api", "evals"]

[tool.pytest.ini_options]
# Run tests from the repo root and import top-level packages (data, evals, ...).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# UP007/UP045 would rewrite Optional[X] -> X | None, which pydantic can't
# evaluate at runtime on Python 3.9 — keep Optional[...] intentionally.
ignore = ["UP007", "UP045"]
# S101 (assert) is fine in tests; long-lines in docstrings handled case-by-case.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
