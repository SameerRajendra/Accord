[project]
name = "accord"
version = "0.0.0"
description = "LLM-powered negotiation-intelligence API — measured, retrieval-augmented, containerized."
readme = "README.md"
# 3.9+ so it runs on the GPU-cluster venv (python3.9). Code avoids PEP 604
# (`X | None`) runtime unions because pydantic evaluates model annotations.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sameer Rajendra" }]
# Runtime deps are pinned in requirements.txt and grow per build phase.
# Phase 0 needs only pydantic; it is duplicated here so `pip install -e .` works.
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
# Everything CI needs: the linter, the test runner, and the packages the test
# suite imports directly. The LLM, retrieval and serving stacks are mocked or
# imported lazily, so tests run without them (full runtime set: requirements.txt).
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data", "analysis", "rag", "agent", "api", "evals", "mcp_server"]

[tool.pytest.ini_options]
# Run tests from the repo root and import top-level packages (data, evals, ...).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# UP007/UP045 would rewrite Optional[X] -> X | None, which pydantic can't
# evaluate at runtime on Python 3.9 — keep Optional[...] intentionally.
# UP006/UP035 would rewrite typing.List/Dict/Tuple -> list/dict/tuple. The code
# uses the typing generics throughout, alongside Optional[...], so annotations
# read one way on the 3.9 deployment target; keep them rather than mix styles.
ignore = ["UP006", "UP007", "UP035", "UP045"]
# S101 (assert) is fine in tests; long-lines in docstrings handled case-by-case.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# S608: the only interpolated values are the module-level table-name constants
# (NODE_TABLE / EDGE_TABLE); every runtime value is a bound query parameter.
"rag/graph_*.py" = ["S608"]
# S608 false positive: the flagged f-string is a troubleshooting message that
# quotes a psql command, not a query.
"evals/_common.py" = ["S608"]
# S105: these are planted canary strings the injection eval looks for, not secrets.
"evals/safety_eval.py" = ["S105"]
# Deployment and benchmark scripts launch fixed argv lists (sglang, streamlit,
# nvidia-smi) inside a container they own: S603/S607. They bind 0.0.0.0 behind
# Modal's proxy (S104), log to /tmp in that container (S108), and poll a server
# that is still booting, where a failed probe is the expected case (S110).
"infra/modal/app.py" = ["S104", "S110", "S603", "S607"]
"benchmarks/bench_serving.py" = ["S108", "S110", "S603", "S607"]
# S110: fire-and-forget warm-up ping; a failure here must never break the page.
"ui/app.py" = ["S110"]
